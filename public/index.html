<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>iframeプロキシ</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input { width: 400px; padding: 8px; font-size: 14px; }
    button { padding: 8px 16px; font-size: 14px; margin-left: 8px; }
    iframe { width: 100%; height: 600px; border: 1px solid #ccc; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>iframeプロキシ</h1>
  <input id="urlInput" type="text" placeholder="https://example.com">
  <button onclick="loadSite()">表示</button>
  <iframe id="frame"></iframe>

  <script>
    function loadSite() {
      const url = document.getElementById('urlInput').value;
      document.getElementById('frame').src = '/proxy?url=' + encodeURIComponent(url);
    }
  </script>
</body>
</html>
